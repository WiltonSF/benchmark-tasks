<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="580" viewBox="0 0 1000 580"><rect width="1000" height="580" fill="white"/><g font-family="sans-serif" fill="#222"><text x="40" y="40" font-size="24">Potato surface registration and 12 soil sectors</text><text x="40" y="74" font-size="17">x along 95 mm axis; phi about x from +y toward +z. Unwrapped parametric map.</text><rect x="200" y="420" width="100" height="48" fill="#623a18"/><text x="200" y="408" font-size="17">1: x=-24, phi=0</text><rect x="200" y="330" width="100" height="48" fill="#623a18"/><text x="200" y="318" font-size="17">2: x=-24, phi=90</text><rect x="200" y="240" width="100" height="48" fill="#623a18"/><text x="200" y="228" font-size="17">3: x=-24, phi=180</text><rect x="200" y="150" width="100" height="48" fill="#623a18"/><text x="200" y="138" font-size="17">4: x=-24, phi=270</text><rect x="430" y="420" width="100" height="48" fill="#623a18"/><text x="430" y="408" font-size="17">5: x=0, phi=0</text><rect x="430" y="330" width="100" height="48" fill="#623a18"/><text x="430" y="318" font-size="17">6: x=0, phi=90</text><rect x="430" y="240" width="100" height="48" fill="#623a18"/><text x="430" y="228" font-size="17">7: x=0, phi=180</text><rect x="430" y="150" width="100" height="48" fill="#623a18"/><text x="430" y="138" font-size="17">8: x=0, phi=270</text><rect x="660" y="420" width="100" height="48" fill="#623a18"/><text x="660" y="408" font-size="17">9: x=24, phi=0</text><rect x="660" y="330" width="100" height="48" fill="#623a18"/><text x="660" y="318" font-size="17">10: x=24, phi=90</text><rect x="660" y="240" width="100" height="48" fill="#623a18"/><text x="660" y="228" font-size="17">11: x=24, phi=180</text><rect x="660" y="150" width="100" height="48" fill="#623a18"/><text x="660" y="138" font-size="17">12: x=24, phi=270</text><text x="40" y="530" font-size="17">Each window: x +/-6 mm, phi +/-11.09 degrees; 5 x 5 baseline cells. No overlap.</text><text x="40" y="558" font-size="17">Area in six registered photographs; assign each cell to its most frontal view once.</text></g></svg>