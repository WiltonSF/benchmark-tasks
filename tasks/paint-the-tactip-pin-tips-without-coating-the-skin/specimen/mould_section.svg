<svg xmlns="http://www.w3.org/2000/svg" width="520" height="440" font-family="Helvetica, Arial, sans-serif">
<rect width="100%" height="100%" fill="white"/>
<text x="10" y="18" font-size="11">Section on the axis, as poured (apex down). Grey: silicone mould; orange: core; black: cast skin.</text>
<text x="10" y="32" font-size="11">Inject through the funnel and 3 mm sprue to the apex; air leaves by the rim vents</text>
<text x="10" y="46" font-size="11">(at 45 degrees to this section) into the flange groove and its four holes. Scale bar 10 mm.</text>
