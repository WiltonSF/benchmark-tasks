<text x="45" y="1060" class="">Folding floor approximation:bounded physical hinge4Nm/rad,0.30Nm cap;slider26mm,500N/m,3N cap.</text>
<text x="45" y="1085" class="">Follower targets measured linkage geometry;these joints stand in for the real PP fold,not extra real hardware.</text>
<text x="45" y="1110" class="">3–8N smoothed opposing force at180mm purchase each step,with counterreaction;fruit/panel contact is declared.</text>
<text x="45" y="1145" class="small">Real enrollment:verify original tool/handle offsets with calipers;fresh half prep&lt;2min;no custom part fabrication.</text>
<text x="45" y="1170" class="small">Source:Dreamfarm Fluicer Lemon DFFU3451 product page and maker product sheet. Dimensions not maker CAD.</text>
