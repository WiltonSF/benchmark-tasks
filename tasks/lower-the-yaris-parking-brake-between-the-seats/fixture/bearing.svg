<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#243b53"/></marker></defs><rect width="1200" height="720" fill="white"/><style>text{font-family:Arial,sans-serif;font-size:17px;fill:#162d40}.small{font-size:15px}.title{font-size:27px;font-weight:bold}.sub{font-size:20px;font-weight:bold}.dim{stroke:#243b53;stroke-width:1.5;marker-start:url(#a);marker-end:url(#a)}.shoe{fill:#c57d47;stroke:#653b24;stroke-width:2}.force{stroke:#243b53;stroke-width:2;marker-end:url(#a)}.guide{stroke:#768a9b;stroke-width:1;stroke-dasharray:5 5}</style><text x="35" y="40" class="title">Passive bearing shoes — original lever unchanged</text><text x="35" y="72">Fabricated geometry and analytic reference only. Native qualification and physical enrollment remain required.</text><text x="40" y="120" class="sub">A36 monolithic L, mirrored for the second finger</text><path d="M99,400 L323,400 L323,368 L131,368 L131,176 L99,176 Z" class="shoe"/><line x1="107" y1="440" x2="323" y2="440" class="dim"/><text x="145" y="465" class="">Foot 27 × 22 × 4 mm</text><line x1="59" y1="400" x2="59" y2="176" class="dim"/><text x="42" y="290" class="">28 mm</text><line x1="131" y1="328" x2="323" y2="328" class="dim"/><text x="160" y="318" class="small">24 mm worst cantilever</text><circle cx="115" cy="264" r="4" fill="white" stroke="#162d40"/><circle cx="115" cy="208" r="4" fill="white" stroke="#162d40"/><text x="40" y="510" class="">Two M3 web holes: z = 17 / 24 mm; 7 mm spacing.</text><text x="40" y="538" class="">Toe adds 2 mm inward. Top and outer foot edge stay fixed.</text><text x="40" y="566" class="">150 N proof case: 3.60 N m; root screen 61.37 MPa.</text><text x="40" y="594" class="">Complete attachment, nylon receipt bounds and proof: shoes.md.</text><text x="620" y="120" class="sub">Analytic cross-section at 74 N total load</text><circle cx="895" cy="280" r="110.25" fill="#e0e6eb" stroke="#243b53" stroke-width="2"/><text x="842" y="275" class="">35 mm grip</text><text x="824" y="300" class="small">geometric estimate</text><rect x="690.865825" y="384.8653299812163" width="170.1" height="25.2" class="shoe"/><line x1="760.169416" y1="225" x2="760.169416" y2="335" class="guide"/><rect x="929.034175" y="384.8653299812163" width="170.1" height="25.2" class="shoe"/><line x1="1029.830584" y1="225" x2="1029.830584" y2="335" class="guide"/><line x1="760.169416" y1="158" x2="1029.830584" y2="158" class="dim"/><text x="786" y="148" class="">42.8 mm loaded pad gap</text><line x1="895" y1="435.25" x2="895" y2="480.25" class="force"/><text x="950" y="490" class="small">Load 74 N</text><text x="620" y="540" class="">38 mm command; stock finger stiffness 5000 N/m.</text><text x="620" y="568" class="">Illustrative stable root: about 12 N lateral reaction per finger.</text><text x="620" y="596" class="">Empty toe contact is 32 mm by independent URDF/box checks.</text><text x="35" y="670" class="small">This schematic is not a measured nylon compliance, a physical proof or a native force result. All material and robot limits remain unchanged.</text></svg>