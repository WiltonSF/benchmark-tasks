roke="#334c59"/><circle cx="462.5" cy="246.25" r="12" fill="#d8dee1" stroke="#334c59"/><circle cx="115.0" cy="365.0" r="15" fill="#d8dee1" stroke="#334c59"/><circle cx="565.0" cy="365.0" r="15" fill="#d8dee1" stroke="#334c59"/><line x1="340.0" y1="427.5" x2="340.0" y2="127.5" stroke="#384d58" stroke-width="8"/><text x="635" y="125" font-size="17">Three218 ×50 ×6.35 base bars</text><text x="635" y="165" font-size="17">Two50 ×80 shim stacks,0..10 high</text><text x="635" y="205" font-size="17">Central clamp212 ×50 ×12.7</text><text x="635" y="245" font-size="17">Rear relief20 ×30; front bridge20</text><text x="635" y="285" font-size="17">Two main158 mm studs at x=±90</text><text x="635" y="325" font-size="17">Four keys:36 ×25 ×25.4</text><text x="635" y="365" font-size="17">Each key has two158 mm studs</text><text x="635" y="405" font-size="17">Key common spreader36 ×40 ×6.35</text><text x="635" y="445" font-size="17">All fixed hardware bounds: z=−100..72</text><text x="35" y="600" font-size="15">Register pivot68 mm above table; floor top18. Flange top20..32; H/recess/shim equation in stock-load-design.md.</text><text x="35" y="640" font-size="16">Positive keys carry cable reaction; clamp captures vertical lift. Lateral retention is qualified by adverse proof.</text><text x="35" y="680" font-size="16">Weld layered clamp/keys before machining relief/holes. Native bounds include3 mm outside weld beads.</text><text x="35" y="720" font-size="16">1 kN frame /100 N adverse push proof and complete grip-load enrollment required; no physical proof claimed.</text><text x="35" y="760" font-size="15">The moving lever tail remains in the rear relief. Native console is conservative over physical root assembly reliefs.</text><text x="35" y="804" font-size="15">All dimensions mm. Black line marks the lever axis; y points toward its grip. See mount.scad for individual parts.</text></g></svg>