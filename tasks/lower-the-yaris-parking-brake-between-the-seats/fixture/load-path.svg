<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" width="1200" height="1000" viewBox="0 0 1200 1000"><ns0:rect width="1200" height="1000" fill="white" /><ns0:g font-family="Arial,sans-serif" fill="#233540"><ns0:text x="35" y="38" font-size="24">Direct load path — side section and coupling detail</ns0:text><ns0:text x="35" y="66" font-size="15">Fabrication dimensions and receipt bounds, not OEM measurements. One-time fit, full curve enrollment and proof required.</ns0:text><ns0:rect x="130.0" y="448.4" width="299.0" height="78.0" fill="#e7ddcb" opacity="1" stroke="#334c59" /><ns0:text x="140" y="545" font-size="16">Table ends at local y=-230 /world y=-650</ns0:text><ns0:rect x="231.4" y="297.6" width="234.0" height="150.8" fill="#d9c5a0" opacity="0.42" stroke="#334c59" /><ns0:rect x="442.0" y="269.0" width="312.0" height="234.0" fill="#c4ab82" opacity="0.42" stroke="#334c59" /><ns0:rect x="429.0" y="448.4" width="1" height="130" fill="#bd5e39" opacity="1" stroke="#334c59" /><ns0:line x1="429.0" y1="230.0" x2="429.0" y2="555.0" stroke="#bd5e39" stroke-width="2" stroke-dasharray="7 5" /><ns0:rect x="312.0" y="415.9" width="520.0" height="32.5" fill="#6e8692" opacity="0.6" stroke="#334c59" /><ns0:rect x="477.75" y="415.9" width="32.5" height="110.5" fill="#6e8692" opacity="0.6" stroke="#334c59" /><ns0:rect x="698.75" y="415.9" width="32.5" height="110.5" fill="#6e8692" opacity="0.6" stroke="#334c59" /><ns0:rect x="429.0" y="503.0" width="338.0" height="23.400000000000002" fill="#c7b794" opacity="1" stroke="#334c59" /><ns0:line x1="130.0" y1="360.0" x2="65.0" y2="321.0" stroke="#424c52" stroke-width="2" /><ns0:line x1="162.5" y1="379.5" x2="299.0" y2="379.5" stroke="#424c52" stroke-width="2" /><ns0:rect x="299.0" y="363.9" width="71.5" height="31.200000000000003" fill="#8ba3af" opacity="1" stroke="#334c59" /><ns0:line x1="370.5" y1="379.5" x2="682.5" y2="379.5" stroke="#536f7e" stroke-width="2" /><ns0:rect x="492.7" y="340.5" width="7.800000000000001" height="78.0" fill="#5d7684" opacity="1" stroke="#334c59" /><ns0:rect x="656.5" y="340.5" width="7.800000000000001" height="78.0" fill="#5d7684" opacity="1" stroke="#334c59" /><ns0:rect x="500.5" y="350.9" width="156.0" height="57.2" fill="#778c97" opacity="0.5" stroke="#334c59" /><ns0:rect x="500.5" y="366.5" width="58.5" height="26.0" fill="#b56c59" opacity="0.6" stroke="#334c59" /><ns0:rect x="562.9000000000001" y="366.5" width="58.5" height="26.0" fill="#b56c59" opacity="0.6" stroke="#334c59" /><ns0:rect x="559.0" y="363.9" width="3.9000000000000004" height="31.200000000000003" fill="#3e5b6d" opacity="1" stroke="#334c59" /><ns0:rect x="496.6" y="364.55" width="52.0" height="29.900000000000002" fill="#6e9aa4" opacity="0.3" stroke="#334c59" /><ns0:rect x="621.4000000000001" y="360.0" width="7.800000000000001" height="39.0" fill="#3e5b6d" opacity="1" stroke="#334c59" /><ns0:text x="35" y="108" font-size="14">Pivot 68 above table; floor top 18</ns0:text><ns0:text x="35" y="137" font-size="14">Rod/nut bounds: z=-30..0, y=-130..-180</ns0:text><ns0:text x="700" y="105" font-size="14">Rear 60 ×60 plates at local y=-411 and-285</ns0:text><ns0:text x="700" y="132" font-size="14">120 mm cage; follower pulls FORWARD</ns0:text><ns0:text x="700" y="159" font-size="14">TwoTOHATSU 45 springs:27.24→54.48 N/mm</ns0:text><ns0:text x="700" y="186" font-size="14">Front stop 8 mm;total 22.1 mm;outerstop 70.9 nominal</ns0:text><ns0:text x="700" y="213" font-size="14">Four 180 mm ties; double full nuts</ns0:text><ns0:text x="700" y="240" font-size="14">Guard rear is BELOW bench only outside edge</ns0:text><ns0:text x="35" y="166" font-size="14">Pin/cartridge axis z=-30..0; front rod sweep z=-20..0</ns0:text><ns0:text x="35" y="570" font-size="20">Swivelling retained-nut yoke — axial cut/detail, mm (drawing diagrammatic)</ns0:text><ns0:rect x="150" y="620" width="8" height="85" fill="#8ba3af" opacity="1" stroke="#334c59" /><ns0:rect x="158" y="655" width="12" height="30" fill="#c7b794" opacity="1" stroke="#334c59" /><ns0:line x1="90" y1="670" x2="245" y2="670" stroke="#4c6370" stroke-width="2" /><ns0:text x="35" y="780" font-size="14">Originalrod 6–8; originalnut 10–12 AF;26 OD/8.5 ID/3 washer</ns0:text><ns0:rect x="158" y="600" width="240" height="18" fill="#8ba3af" opacity="1" stroke="#334c59" /><ns0:rect x="158" y="730" width="240" height="18" fill="#8ba3af" opacity="1" stroke="#334c59" /><ns0:rect x="290" y="626" width="145" height="84" fill="#678591" opacity="1" stroke="#334c59" /><ns0:circle cx="330" cy="668" r="16" fill="#d6dbdf" stroke="#233540" /><ns0:line x1="360" y1="668" x2="555" y2="668" stroke="#4c6370" stroke-width="2" /><ns0:text x="620" y="750" font-size="14">3/8-16 new rod;20 full thread engagement</ns0:text><ns0:text x="620" y="600" font-size="15">Yoke 40 ×24 ×3 plate,10 ×17 slot</ns0:text><ns0:text x="620" y="630" font-size="15">Two 55 ×24 ×6 cheeks,inside gap 28</ns0:text><ns0:text x="620" y="660" font-size="15">Pin 10 ×40,centre 50 behind front plate</ns0:text><ns0:text x="620" y="690" font-size="15">Eye 12 ×26 ×50,pin 10 from front</ns0:text><ns0:text x="620" y="720" font-size="15">Two 8 mm spacers;M 3 retainers,8 mm blind bores</ns0:text><ns0:text x="35" y="810" font-size="16">1 kN axial/60 s frame proof;100 N adverse guard/grip push;150 N/shoe proof. No physical proof claimed.</ns0:text><ns0:text x="35" y="845" font-size="15">Lower targets 0/5/10/15/20/25/30 deg:3.9/13.5/27/40.5/54/67.5/81 N at 210 mm.</ns0:text><ns0:text x="35" y="875" font-size="15">35/36.5 deg:94.5/98.55 N; upperband=progressive model+declaredgravitybound.</ns0:text><ns0:text x="35" y="905" font-size="15">Reference 35 mm link /1 mm preload are estimates. ActualOEM curve/fit/proof must be enrolled.</ns0:text><ns0:text x="35" y="945" font-size="15">Exact sleeve/socket/seat dimensions:stock-load-design.md andcartridge.scad. No physical result claimed.</ns0:text></ns0:g></ns0:svg>