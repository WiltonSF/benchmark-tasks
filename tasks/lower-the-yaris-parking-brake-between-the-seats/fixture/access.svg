acity="1" stroke="#334c59" /><ns0:rect x="322.0" y="550.0" width="6.0" height="100.0" fill="#7b8d94" opacity="1" stroke="#334c59" /><ns0:rect x="310.0" y="620.0" width="30.0" height="30.0" fill="#a7b5ba" opacity="1" stroke="#334c59" /><ns0:line x1="80" y1="750" x2="630" y2="750" stroke="#b04832" stroke-width="2" stroke-dasharray="7 5" /><ns0:text x="680" y="140" font-size="16">Table 1100 ×1300; rear edge y=-650</ns0:text><ns0:text x="680" y="230" font-size="16">220 seat gap /80 console slot retained</ns0:text><ns0:text x="680" y="320" font-size="16">Grip 35 diameter,r 170–272; holdr 228</ns0:text><ns0:text x="680" y="410" font-size="16">Pivotworld(300,-420); original buttonr 297</ns0:text><ns0:text x="680" y="520" font-size="16">Tunnel 116 ×180: local y=-258..-78</ns0:text><ns0:text x="680" y="610" font-size="16">Rearbox 116 ×240: local y=-480..-240</ns0:text><ns0:text x="680" y="670" font-size="16">Rearboxfrontworld y=-660, beyond edge</ns0:text><ns0:text x="680" y="740" font-size="16">Shelf 220 ×260; two 400 ×25 edge-on rails</ns0:text><ns0:text x="680" y="820" font-size="16">Rearbox/shelf overhang explicitly supported</ns0:text><ns0:text x="35" y="966" font-size="15">Front mounting datum stays on the bench; offset colliders include the complete overhang. See dimensions.json.</ns0:text></ns0:g></ns0:svg>