<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420" font-family="sans-serif" font-size="13">
  <rect width="760" height="420" fill="#ffffff"/>
  <text x="20" y="24" font-size="15" font-weight="bold">Nosepiece and slide, as modelled (mm; estimates unless marked)</text>
  <!-- top view -->
  <text x="20" y="50">Top view, robot at the bottom of the drawing (scale 2.5 px/mm)</text>
  <g transform="translate(200,230)">
    <rect x="-94" y="-31" width="188" height="62" fill="#e8f2f4" stroke="#557"/>
    <text x="100" y="20">slide 75 x 25 x 1 (left-right)</text>
    <circle cx="0" cy="0" r="5" fill="#fff4b0" stroke="#aa8"/>
    <text x="10" y="18">lit spot, 4 across, at the light path</text>
    <circle cx="0" cy="-70" r="90" fill="none" stroke="#333" stroke-dasharray="4 3"/>
    <text x="-60" y="-168">knurled ring 72 across; axis 28 behind the light path</text>
    <circle cx="0" cy="0" r="11" fill="#2f6fd6" opacity="0.6"/>
    <text x="-140" y="4">40x (start)</text>
    <circle cx="72" cy="-70" r="11" fill="#dddddd" stroke="#333"/>
    <text x="88" y="-66">100x oil (start: right)</text>
    <circle cx="0" cy="-140" r="11" fill="#d63a3a" opacity="0.6"/>
    <text x="16" y="-140">4x (back)</text>
    <circle cx="-72" cy="-70" r="11" fill="#e8d21a" opacity="0.7"/>
    <text x="-170" y="-66">10x (left)</text>
    <path d="M -88 -51 A 90 90 0 0 1 -64 -134" fill="none" stroke="#c00" stroke-width="2" marker-end="url(#a)"/>
    <text x="-200" y="-150" fill="#c00">left rim pushed back:</text><text x="-200" y="-134" fill="#c00">100x comes round</text>
  </g>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#c00"/></marker></defs>
  <!-- side facts -->
  <g transform="translate(470,80)">
    <text x="0" y="0" font-weight="bold">Heights and stops</text>
    <text x="0" y="22">stage top 120 above the bench; slide top 121</text>
    <text x="0" y="42">objective shoulders 45 above the slide (parfocal)</text>
    <text x="0" y="62">working distance: 4x 17, 10x 7, 40x 0.6, 100x 0.2</text>
    <text x="0" y="82">nosepiece axis leans 15 deg toward the robot</text>
    <text x="0" y="102">click stops every 90 deg (100x at -90 deg)</text>
    <text x="0" y="122">objective barrels 20 across, noses 9 across</text>
    <text x="0" y="152" font-weight="bold">Oil (declared model)</text>
    <text x="0" y="174">one drop: 10 N on both bulb pads, tip down</text>
    <text x="0" y="194">drop 5 across, 1.2 tall, where the tip points</text>
    <text x="0" y="214">over 35 N: a stream (score 0)</text>
    <text x="0" y="234">dry lens below the drop top, within 7 of its</text>
    <text x="0" y="252">centre: fouled (score 0)</text>
    <text x="0" y="282" font-weight="bold">Dropping bottle</text>
    <text x="0" y="304">36 across, neck top 88 up, 12/18 joint</text>
    <text x="0" y="324">dropper 114 long, bulb 15 x 32</text>
  </g>
</svg>
