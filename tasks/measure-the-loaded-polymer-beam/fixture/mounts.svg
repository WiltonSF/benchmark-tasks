<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="995" viewBox="0 0 1000 995"><rect width="1000" height="995" fill="white"/><g fill="none" stroke="#222" stroke-width="2"><rect x="80" y="100" width="280.4" height="331.2"/><circle cx="118.6" cy="164" r="10.4"/><circle cx="321.8" cy="164" r="10.4"/><circle cx="118.6" cy="367.2" r="10.4"/><circle cx="321.8" cy="367.2" r="10.4"/><circle cx="220.2" cy="265.6" r="16.8"/><path d="M80 460H360.4M80 450V470M360.4 450V470"/><rect x="520" y="180" width="240" height="160"/><path d="M560 180V285H720V180"/><circle cx="540" cy="250" r="32"/><circle cx="740" cy="250" r="32"/></g><g font-family="Arial,sans-serif" font-size="20" fill="#111"><text x="40" y="40">Custom adapter estimates — dimensions in mm, version 3</text><text x="80" y="80">A1 plate top view, 12 thick</text><text x="185" y="490">70.1</text><text x="80" y="530">82.8 high; 4 x Ø5.2 on 50.8 square</text><text x="80" y="565">Centre Ø8.4; underside Ø14 x 6 counterbore</text><text x="490" y="100">A2 split clevis: 30 x 25 x 20</text><text x="490" y="135">Pin Ø8; check actual eye bore before machining</text><text x="490" y="395">#10-32 female coupler: Ø12 x 18, 12 deep</text><text x="490" y="435">Original G1097 eye retained</text><text x="40" y="615">A1/A2 fit and native working angle require a real assembly check; no OEM compatibility claim.</text></g><g fill="none" stroke="#222" stroke-width="2"><rect x="272" y="740" width="456" height="60"/><circle cx="500" cy="770" r="9"/><path d="M462 760V860H538V760" stroke-dasharray="6 4"/><path d="M682 740V727Q692 712 702 727V740"/><path d="M308 696V732M300 724L308 736L316 724"/><path d="M692 694V708"/><path d="M300 800V830M314 800V830"/><path d="M308 890H500M500 890H692M308 882V898M500 882V898M692 882V898"/></g><g font-family="Arial,sans-serif" font-size="20" fill="#111"><text x="40" y="648">R1 rocker, side view (X to the right): 6061 bar 76 x 6 x 10 high; Ø3 pivot 5 below top, in a clevis</text><text x="560" y="688">bar underside at mid-span: tip touches here</text><text x="60" y="688">dial contact point (down)</text><text x="712" y="734">M3 button head</text><text x="150" y="860">stop and balance screws</text><text x="548" y="850">clevis (dashed) on fixture</text><text x="380" y="920">32.0 ± 0.1</text><text x="570" y="920">32.0 ± 0.1</text><text x="40" y="950">With no bar the tip stands 0.5 above the roller-top line; the resting bar presses it down 0.5,</text><text x="40" y="975">lifting the dial spindle about 0.5 mm into its 5 mm travel, where the dial is zeroed.</text></g></svg>